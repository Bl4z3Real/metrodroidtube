name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      # Opzionale: client OAuth (non è un segreto per le app installate) da Settings > Secrets
      - name: Imposta il client OAuth
        env:
          CID: ${{ secrets.OAUTH_CLIENT_ID }}
          CSEC: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          if [ -n "$CID" ]; then
            sed -i "s/INSERISCI_CLIENT_ID/$CID/; s/INSERISCI_CLIENT_SECRET/$CSEC/" app/src/main/java/it/metro/tube/MainActivity.kt
          fi
      - name: Keystore personale (opzionale)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/my.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/my.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk MetroTube-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: MetroTube-*.apk
          generate_release_notes: true
